[project]
name = "meta-hackathon"
version = "0.1.0"
description = "KrishiBondhu.AI: a Bangla crop-health advisor for Bangladeshi farmers (photo diagnosis, official advice, day-by-day plans, officer booking)"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Fahim Muntasir", email = "muntasirfahim.niloy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "langchain>=1.4.7",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.7.2",
    "langchain-postgres",
    "langgraph-api>=0.17.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-cli[inmem]>=0.4.40",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
meta-hackathon = "meta_hackathon:main"
krishi-db = "meta_hackathon.dbcli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
